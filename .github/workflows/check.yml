# main 푸시·PR마다: 출처 검사 → 이식 검증 → 정적 빌드 → 문법 검사 → 화면 동등성 검사 + 수강생 전 과정 검사
# PR 브랜치에 푸시하면 push와 pull_request가 같은 검사를 두 번 돌렸다(각 약 6분). push는 main만 돌린다.
# 같은 PR에 새 커밋이 오면 앞선 검사는 멈춘다(main은 멈추지 않는다).
# 2026-11-12: Node를 Vercel과 같은 26으로 맞춤. 화면 검사 2개를 동시에 돌림(차례로 돌리면 합쳐 약 6분 30초).
#   PR이 문서(docs/, 루트의 *.md)만 바꾸면 화면 검사는 건너뛴다(빌드·문법 검사는 한다). main 푸시는 항상 전부 돌린다.
name: check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # PR에서는 checkout이 "합친 결과" 커밋을 받으므로 HEAD^1이 합쳐질 쪽(main)이다
      - name: 문서만 바뀌었는지 확인
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "browser=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|[^/]+[.]md$)'; then
            echo "browser=no" >> "$GITHUB_OUTPUT"
            echo "문서만 바뀜: 화면 검사를 건너뜁니다."
          else
            echo "browser=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.browser == 'yes'
        run: npx playwright install --with-deps chromium
      - name: 화면 검사 2개 (동시에)
        if: steps.scope.outputs.browser == 'yes'
        run: |
          npm run test:parity > parity.log 2>&1 &
          p1=$!
          npm run test:walk > walk.log 2>&1 &
          p2=$!
          r1=0; r2=0
          wait $p1 || r1=$?
          wait $p2 || r2=$?
          echo "===== 동등성 검사 (종료 코드 $r1) ====="; cat parity.log
          echo "===== 전 과정 검사 (종료 코드 $r2) ====="; cat walk.log
          if [ $r1 -ne 0 ] || [ $r2 -ne 0 ]; then exit 1; fi
