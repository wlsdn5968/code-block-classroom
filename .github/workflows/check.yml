# main 푸시·PR마다: 출처 검사 → 이식 검증 → 정적 빌드 → 프로토타입과 화면 동등성 검사 → 수강생 전 과정 검사
# PR 브랜치에 푸시하면 push와 pull_request가 같은 검사를 두 번 돌렸다(각 약 6분). push는 main만 돌린다.
# 같은 PR에 새 커밋이 오면 앞선 검사는 멈춘다(main은 멈추지 않는다).
name: check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity
      - run: npm run test:walk
