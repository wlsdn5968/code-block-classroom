<title>코드 블록 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column "assembly manual" — graph paper, 9 colored blocks as parts list; each block = lesson (guess → explain → lab) */
:root{
  --paper:#f7f8f4; --grid:#e3e7df; --ink:#1f2523; --muted:#5f6864; --line:#cfd5cd; --card:#ffffff; --soft:#f1f3ef;
  --hl:#ffd23f; --good:#25845a; --bad:#c43d2b; --goodbg:#e2f3ea; --badbg:#fae4df; --notebg:#fff6cf;
  --code:#1f2523; --codefg:#e8efe9; --codehl:#5a2a22;
  --b-ui:#3b82c4; --b-server:#7a5bd1; --b-db:#d9822b; --b-auth:#2f9e8f; --b-ext:#d14d8a;
  --b-key:#b8921c; --b-host:#4f9a3a; --b-always:#c4473b; --b-repo:#4b5563;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.score{font-family:var(--mono);font-size:13px;background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:20px;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:34px} h2{font-size:26px} h3{font-size:21px}
p{margin:0}
.lead{color:var(--muted)}
.page{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:5px 5px 0 var(--ink);min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;cursor:pointer;width:100%;font-size:16px}
.btn.alt{background:#fff;color:var(--ink)}
.btn.sm{width:auto;padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input{color:var(--ink);-webkit-text-fill-color:currentColor;font-family:var(--body)}
.opt,.part,.mi,.type,.chip,.tog,.cm,.tabs button{color:var(--ink)}
.opt.right,.opt.wrong,.tog.on,.chip.on,.tabs button.on{color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.note{background:var(--notebg);border-radius:6px;padding:10px 12px;font-size:15px}
.big{font-size:18px}
code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:1px 5px;border-radius:3px;word-break:break-all}
small.src,.src{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.6}
.src a{color:var(--muted)}

.brick{display:inline-flex;align-items:center;font-weight:700;color:#fff;padding:5px 10px 5px 8px;border-radius:6px;font-size:14.5px;line-height:1.2;white-space:nowrap}
.brick::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:11px 0 0 rgba(255,255,255,.6);margin-right:15px;flex-shrink:0}
.bricks{display:flex;gap:6px;flex-wrap:wrap}

/* home menu */
.menu{display:flex;flex-direction:column;gap:10px}
.mi{font:inherit;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.mi .n{font-family:var(--display);font-size:28px;line-height:1}
.mi b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.mi span{font-size:14px;color:var(--muted);line-height:1.4;display:block}
.mi i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* parts picker */
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.part{font:inherit;border:2px solid var(--ink);border-radius:8px;background:#fff;padding:9px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;min-width:0;position:relative}
.part .sw{width:100%;height:12px;border-radius:3px}
.part b{font-size:14px;line-height:1.3}
.part em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.3}
.part.on{background:var(--hl)}
.part.seen::after{content:"✓";position:absolute;top:22px;right:8px;font-size:12px;color:var(--good);font-weight:700}
@media (max-width:420px){.parts{grid-template-columns:repeat(2,1fr)}}

/* lesson */
.bhead{color:#fff;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.bhead h2{color:#fff}
.bhead span{font-family:var(--mono);font-size:12px;opacity:.92}
.guess{border:2px dashed var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.guess .q{font-size:19px;font-weight:700;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:11px 13px;cursor:pointer}
.opt.right{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.reveal{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.reveal.ok{background:var(--goodbg)} .reveal.no{background:var(--badbg)}
.reveal strong{font-family:var(--display);font-weight:400;font-size:20px}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px dashed var(--line)}
.sec h3 .k{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px;vertical-align:3px}
.sec p+p{margin-top:2px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:360px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700}
.sum{background:var(--ink);color:#fff;border-radius:8px;padding:14px 16px;font-size:16.5px}
.sum b{color:var(--hl)}
.lock{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}

/* lab */
.lab{border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.lab .lh{background:var(--hl);padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lab .lh span{font-family:var(--mono);font-size:11px;font-weight:500;align-self:center}
.lab .lb{padding:14px;display:flex;flex-direction:column;gap:12px}
.term{background:var(--code);color:var(--codefg);font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:10px 0;overflow-x:auto}
.term .ln{display:block;padding:1px 12px;white-space:pre;cursor:default;border:0;background:none;color:inherit;font:inherit;width:100%;text-align:left}
.term button.ln{cursor:pointer}
.term .ln:hover{background:#2d3633}
.term .ln.hit{background:var(--codehl)}
.term .ln.miss{background:#3a3f3d}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{font:inherit;border:2px solid var(--ink);border-radius:20px;padding:5px 12px;background:#fff;cursor:pointer;font-size:14px}
.tog.on{background:var(--ink);color:#fff}
.out{border-radius:8px;padding:10px 12px;font-size:15px}
.out.ok{background:var(--goodbg)} .out.no{background:var(--badbg)} .out.nt{background:var(--soft)}
input[type=number]{font:inherit;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;width:120px}
.shop{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shop b{font-size:17px}
.dbt{overflow-x:auto}
.dbt table{border-collapse:collapse;width:100%;font-size:14px;font-family:var(--mono);min-width:340px}
.dbt th,.dbt td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.dbt th{background:var(--soft)}
.dbt tr.hide td{color:#b8beba;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#f2f3f0 6px,#f2f3f0 12px)}
.keys{display:flex;flex-direction:column;gap:8px}
.kc{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kc code{font-size:12.5px}
.dev{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dv{border:2px solid var(--ink);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.dv b{font-size:14px}
.tl{display:flex;flex-direction:column;gap:0;font-family:var(--mono);font-size:13px}
.tl div{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.tl .dead{color:#a7ada9}
.commits{display:flex;flex-direction:column;gap:6px}
.cm{font:inherit;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer}
.cm .dot{width:14px;height:14px;border-radius:50%;background:var(--b-repo)}
.cm.head{border-color:var(--ink);background:var(--soft)}
.cm i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.screen{border:2px solid var(--ink);border-radius:8px;padding:14px;text-align:center;font-weight:700}
.screen.bad{background:#fff;color:#c9cfcb;border-style:dashed}

/* type */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{font:inherit;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.type .ico{font-size:26px;line-height:1}
.type b{font-family:var(--display);font-weight:400;font-size:20px}
.type span{font-size:13px;color:var(--muted);line-height:1.4}
.type.done::after{content:"완료";position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;background:var(--good);color:#fff;padding:2px 7px;border-radius:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:20px;border:1.5px solid var(--line);color:var(--muted);background:#fff;cursor:pointer}
.tabs button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.asm{display:flex;flex-direction:column;gap:8px}
.asm .r{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:8px;border-radius:8px}
.asm .r.need{background:var(--soft)}
.asm .r.maybe .brick{background:#fff!important;color:var(--ink);border:2px dashed var(--ink)}
.asm .r.maybe .brick::before{background:var(--line);box-shadow:11px 0 0 var(--line)}
.asm .r.no{opacity:.45}
.asm .r.no .brick{background:#9aa19d!important}
.asm .tag{font-family:var(--mono);font-size:11px;display:block;color:var(--muted)}
.asm p{font-size:14.5px}
@media (max-width:460px){.asm .r{grid-template-columns:1fr;gap:4px}.dev{grid-template-columns:1fr}}
.flow{padding:0;margin:0;counter-reset:f;display:flex;flex-direction:column}
.flow li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0}
.flow li::before{counter-increment:f;content:counter(f);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.bub{background:var(--soft);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px}
.bub .who{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-bottom:4px}

/* phrasebook */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1.5px solid var(--ink);border-radius:20px;background:#fff;padding:3px 10px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.ph{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ph .say{font-family:var(--mono);font-size:14px;background:var(--soft);border-radius:6px;padding:6px 10px;word-break:break-word}
.ph .say.danger{background:var(--badbg)}
.ph dl{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;margin:0;font-size:15px}
.ph dt{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:4px}
.ph dd{margin:0}
.rules{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.rules li{border-left:4px solid var(--hl);padding:4px 0 4px 12px}
.srclist{padding-left:18px;margin:0;font-size:13.5px}
.srclist li{margin-bottom:3px}
.srclist a{color:var(--ink)}
.foot{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){.page{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <div class="top">
    <button class="brand" onclick="go('home')">코드 블록 교실<small>프로토타입 v3</small></button>
    <div class="score" id="score">정답 0 / 0</div>
  </div>
  <main id="app"></main>
  <p class="foot">교육용 프로토타입 · 모든 설명은 화면 아래 표시한 공식 문서로 2026-10-09에 확인 · 실험은 실제 서비스가 아닌 시뮬레이션</p>
</div>

<script>
/* ============ 출처 (2026-10-09 확인) ============ */
const SRC={
  mdn:["MDN · 클라이언트-서버 개요","https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview"],
  devtools:["MDN · 브라우저 개발자 도구","https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools"],
  react:["React · 첫 컴포넌트","https://react.dev/learn/your-first-component"],
  nextenv:["Next.js · 환경 변수","https://nextjs.org/docs/app/guides/environment-variables"],
  sbkey:["Supabase · API 키","https://supabase.com/docs/guides/api/api-keys"],
  sbrls:["Supabase · RLS","https://supabase.com/docs/guides/database/postgres/row-level-security"],
  sbmig:["Supabase · 마이그레이션","https://supabase.com/docs/guides/deployment/database-migrations"],
  sbauth:["Supabase · Auth","https://supabase.com/docs/guides/auth"],
  sbpause:["Supabase · 무료 프로젝트 일시정지","https://supabase.com/docs/guides/platform/free-project-pausing"],
  gitbook:["Git 공식 책 · 버전 관리란","https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"],
  gitwt:["Git · worktree","https://git-scm.com/docs/git-worktree"],
  gitpush:["Git · push","https://git-scm.com/docs/git-push"],
  ccwt:["Claude Code · 워크트리로 병렬 작업","https://code.claude.com/docs/en/common-workflows"],
  ghignore:["GitHub · .gitignore","https://docs.github.com/en/get-started/git-basics/ignoring-files"],
  ghleak:["GitHub · 민감정보 삭제","https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository"],
  vercel:["Vercel · Git 배포","https://vercel.com/docs/git"],
  rfc:["RFC 6761 · localhost","https://www.rfc-editor.org/rfc/rfc6761"],
  ec2:["AWS · EC2 개념","https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html"],
  npm:["npm · install","https://docs.npmjs.com/cli/v10/commands/npm-install"],
  rm:["man7 · rm","https://man7.org/linux/man-pages/man1/rm.1.html"],
  tosskey:["토스페이먼츠 · API 키","https://docs.tosspayments.com/reference/using-api/api-keys"],
  tossflow:["토스페이먼츠 · 결제위젯 연동","https://docs.tosspayments.com/guides/v2/payment-widget/integration"],
  tosshook:["토스페이먼츠 · 웹훅","https://docs.tosspayments.com/guides/v2/webhook"],
  upbit:["업비트 · 인증(키 권한·IP)","https://docs.upbit.com/kr/reference/auth"],
  kis:["한국투자증권 · KIS Developers","https://apiportal.koreainvestment.com/intro"],
  kismock:["위키독스 · KIS API 신청 (2차 자료)","https://wikidocs.net/159301"],
  kakao:["Kakao Developers · 카카오톡 메시지","https://developers.kakao.com/docs/latest/ko/kakaotalk-message/common"],
  insta:["Meta · Instagram 플랫폼","https://developers.facebook.com/docs/instagram-platform"],
  claude:["Claude · API 요금","https://platform.claude.com/docs/en/about-claude/pricing"]
};
const src=k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a>`;
const srcs=a=>`<span class="src">근거 · ${a.map(src).join(" · ")}</span>`;

/* ============ 블록 9개: 예측 질문 → 설명 → 실험 → 요약 ============ */
const B={
 ui:{name:"화면",word:"프론트엔드",
  hook:{q:"아무 웹사이트에서 마우스 오른쪽 버튼 → '검사'를 누르면 무엇이 보일까요?",opts:["아무것도 안 보인다. 회사 비밀이니까","그 화면을 만든 코드가 보인다","회사 직원만 볼 수 있다"],a:1,
    reveal:"화면을 만든 코드가 그대로 보여요. 화면 코드는 여러분 기기로 <b>배달된 파일</b>이라서, 받은 사람은 누구나 열어볼 수 있어요."},
  sec:[
   ["주소를 열면 무슨 일이 생길까","주소창에 주소를 치면 브라우저(크롬, 사파리 같은 프로그램)가 그 주소의 컴퓨터에 \"화면 파일 주세요\"라고 <b>요청</b>해요. 파일이 도착하면 브라우저가 그걸 읽어서 그림처럼 그려줘요.<p class='lead'>화면은 '저쪽에서 그려서 보내주는 사진'이 아니라, '설계도를 받아서 내 기기가 직접 그리는 것'이에요.</p>",["mdn"]],
   ["화면 파일의 재료 세 가지",`<div class="tbl"><table><tr><th>재료</th><th>하는 일</th><th>예시</th></tr><tr><td><b>HTML</b></td><td>뼈대. 무엇이 있는지</td><td>제목, 버튼, 입력칸</td></tr><tr><td><b>CSS</b></td><td>옷. 어떻게 보이는지</td><td>색, 크기, 위치</td></tr><tr><td><b>JavaScript</b></td><td>움직임. 누르면 무슨 일이 생기는지</td><td>버튼 누르면 창 열기</td></tr></table></div>`,["mdn"]],
   ["직접 열어볼 수 있어요","'개발자 도구'라는 기능으로 열어요. 윈도우는 <code>F12</code> 또는 <code>Ctrl+Shift+I</code>, 맥은 <code>⌘+⌥+I</code>예요. 글자 색을 바꿔보는 것도 돼요. 단, 바뀌는 건 <b>내 화면에서만</b>이고 저장되지는 않아요.",["devtools"]],
   ["AI가 말하는 React, Next.js는?","<b>React</b>는 화면을 '부품' 단위로 만드는 도구예요. React 공식 문서는 이 부품을 <b>컴포넌트</b>라고 부르고, 다시 쓸 수 있는 화면 조각이라고 설명해요. 버튼 부품 하나를 만들어두면 여러 곳에서 다시 써요.<br><b>Next.js</b>는 React로 화면을 만들면서 서버 쪽 코드도 같은 프로젝트에 넣을 수 있는 도구예요.",["react","nextenv"]]
  ],
  lab:"ui",sum:"화면은 사용자 기기로 <b>배달되는 파일</b>이다. 배달된 건 누구나 열어볼 수 있다. 그래서 화면 코드에는 비밀을 두지 않는다."},
 server:{name:"서버",word:"백엔드",
  hook:{q:"쇼핑몰에서 9,900원짜리 상품의 가격을, 내 화면에서 100원으로 고쳐서 주문을 보내면?",opts:["100원에 산다","9,900원으로 결제된다","서버가 확인하느냐에 따라 다르다"],a:2,
    reveal:"서버가 \"이 상품 진짜 가격이 얼마였지?\"를 다시 확인하면 막혀요. 확인하는 코드가 없으면 <b>100원에 팔릴 수도</b> 있어요. 그래서 중요한 확인은 서버에서 해요."},
  sec:[
   ["요청과 응답","화면은 서버에 <b>요청</b>을 보내고, 서버는 <b>응답</b>을 돌려줘요. 응답에는 결과 번호(상태 코드)가 붙어요.<div class='tbl'><table><tr><th>번호</th><th>뜻</th></tr><tr><td>200</td><td>성공</td></tr><tr><td>404</td><td>찾는 게 없음</td></tr><tr><td>403</td><td>권한 없음</td></tr></table></div>AI가 \"404 에러가 나요\"라고 하면 '없는 주소로 요청했다'는 뜻이에요.",["mdn"]],
   ["서버는 사용자가 못 만지는 곳","서버 코드는 서비스 쪽 컴퓨터에서 돌아가고, 사용자에게는 <b>결과만</b> 보내요. 코드 자체는 배달되지 않아요. 그래서 비밀 열쇠 보관, 가격 확인, 권한 확인처럼 사용자가 손대면 안 되는 일을 여기서 해요.",["mdn"]],
   ["화면에서 온 값은 믿지 않기","MDN은 주소에 붙은 값을 사용자가 바꿔서 다시 보낼 수 있으니 안전하지 않다고 설명해요. 화면에서 보낸 금액, 점수, 등급 같은 값도 마찬가지로 생각해야 해요. 서버는 받은 값을 <b>자기 기록과 다시 비교</b>해요.",["mdn"]],
   ["서버를 꼭 직접 만들어야 하나요?","Supabase를 쓰면 기록장 읽기·쓰기는 화면에서 바로 하고, 출입 규칙(RLS)이 확인을 맡을 수 있어요. 하지만 <b>숨겨야 하는 열쇠가 필요한 일</b>(결제 승인, AI 호출 등)은 서버가 있어야 해요.",["sbkey","tosskey"]]
  ],
  lab:"server",sum:"서버는 <b>사용자가 손댈 수 없는 곳</b>에서 확인하고 계산한다. 화면에서 온 값은 다시 확인한다."},
 db:{name:"기록장",word:"데이터베이스 (DB)",
  hook:{q:"앱을 지웠다가 다시 깔았더니 내가 쓴 글이 그대로 있어요. 그 글은 어디에 있었을까요?",opts:["내 휴대폰 안","내 휴대폰 밖, 서비스 쪽 기록장","앱 설치 파일 안"],a:1,
    reveal:"앱을 지워도 남아 있다면 내 기기 밖에 적혀 있었다는 뜻이에요. 그 '밖의 기록장'이 데이터베이스예요."},
  sec:[
   ["기록장은 엑셀 표처럼 생겼어요",`<div class="tbl"><table><tr><th>엑셀</th><th>데이터베이스</th></tr><tr><td>시트 한 장</td><td>표(테이블) 하나. 예: 주문 표</td></tr><tr><td>가로줄 한 줄</td><td>기록 한 건. 예: 주문 1개</td></tr><tr><td>세로칸</td><td>항목. 예: 주문자, 금액, 날짜</td></tr></table></div>`,["sbrls"]],
   ["기록장에 하는 기본 일 네 가지","넣기, 읽기, 고치기, 지우기예요. 이걸 시키는 말이 <b>SQL</b>이에요. 예를 들어 <code>select * from orders</code>는 \"주문 표 전부 보여줘\"라는 뜻이에요.<p class='lead'>AI가 SQL을 실행하자고 하면 <code>delete</code>(지우기)나 <code>drop</code>(표 통째로 삭제)이 들어 있는지 먼저 보세요.</p>",["sbmig"]],
   ["표의 모양을 바꾸는 건 '마이그레이션'","칸을 추가하거나 새 표를 만드는 것처럼 <b>구조</b>를 바꾸는 SQL을 파일로 남겨 두는 방식이에요. Supabase 문서는 마이그레이션을 '스키마(표 구조)를 만들고 바꾸고 지우는 SQL'이라고 설명해요. 변경 기록이 남아서 언제 무엇을 바꿨는지 추적할 수 있어요.",["sbmig"]],
   ["출입 규칙 RLS","RLS(Row Level Security)는 표의 <b>줄마다</b> 누가 볼 수 있는지 정하는 규칙이에요. 규칙이 기록장 안에 있어서, 어떤 경로로 들어와도 똑같이 적용돼요. Supabase는 외부에 열린 모든 표에 RLS를 켜라고 해요.",["sbrls"]],
   ["Supabase 무료 플랜 주의","Supabase는 7일 동안 활동이 적은 무료 프로젝트를 일시정지해요. 갑자기 안 열리면 이것부터 확인하세요.",["sbpause"]]
  ],
  lab:"db",sum:"기록장은 <b>앱을 꺼도 남는 표</b>다. 누가 어느 줄을 볼지는 RLS가 정한다."},
 auth:{name:"로그인",word:"인증 · 권한",
  hook:{q:"로그인을 잘 붙였는데, 로그인한 준호에게 민지의 주문 내역까지 보여요. 뭐가 빠졌을까요?",opts:["로그인 기능","'자기 것만 보기' 규칙","더 비싼 서버"],a:1,
    reveal:"로그인은 \"너 누구야?\"까지만 해결해요. \"너 이거 봐도 돼?\"는 별도의 <b>권한 규칙</b>이 정해요. 둘은 다른 블록이에요."},
  sec:[
   ["질문 두 개를 구분하세요",`<div class="tbl"><table><tr><th>어른 말</th><th>쉬운 질문</th><th>예</th></tr><tr><td><b>인증</b> (Authentication)</td><td>당신 누구예요?</td><td>로그인</td></tr><tr><td><b>권한</b> (Authorization)</td><td>이거 해도 돼요?</td><td>자기 주문만 보기</td></tr></table></div>Supabase 문서도 인증은 '사용자가 본인이 맞는지 확인', 권한은 '무엇에 접근할 수 있는지 확인'이라고 나눠 설명해요.`,["sbauth"]],
   ["소셜 로그인은 '대신 확인해주기'","구글, 애플, 깃허브 계정으로 로그인하는 방식이에요. 그 회사가 \"이 사람 맞아요\"를 대신 확인해줘요. 이런 연결에 쓰는 표준 방식을 <b>OAuth</b>라고 해요. Supabase Auth는 구글·애플·깃허브 등을 지원하고, OAuth2를 지원하는 다른 곳도 붙일 수 있어요.",["sbauth"]],
   ["언제 꼭 필요할까","남이 보면 안 되는 정보(내 주문, 회사 숫자)가 있거나, 돈이 드는 기능(AI 호출 등)이 있으면 필요해요. 아무나 쓰게 두면 요금은 서비스 주인이 내요.",["claude"]]
  ],
  lab:"auth",sum:"로그인은 <b>누구인지</b>, 권한 규칙은 <b>무엇을 해도 되는지</b>. 둘 다 있어야 한다."},
 ext:{name:"빌려 쓰기",word:"외부 API",
  hook:{q:"AI 챗봇 서비스를 만들고 싶어요. AI를 직접 만들어야 할까요?",opts:["네, AI부터 학습시켜야 한다","아니요, AI 회사 기능을 빌려 쓴다"],a:1,
    reveal:"AI 회사가 열어둔 <b>API</b>로 질문을 보내고 답을 받아요. 결제, 지도, 주식 시세, 카톡 알림도 대부분 이렇게 빌려 써요."},
  sec:[
   ["API = 미리 정한 주문 양식","\"이 주소로, 이런 형식으로 요청하면, 이런 형식으로 답해줄게\"라는 약속이에요. 양식만 맞추면 상대 회사 내부를 몰라도 기능을 쓸 수 있어요.",["mdn"]],
   ["답은 보통 JSON으로 와요","JSON은 <b>이름표가 붙은 데이터</b>예요. <code>{\"temp\": 18}</code>은 \"temp라는 이름표에 18\"이라는 뜻이에요. 사람도 읽을 수 있어서 AI가 자주 보여줘요.",["mdn"]],
   ["반대 방향도 있어요: 웹훅","보통은 내가 물어보지만, 웹훅은 <b>상대가 먼저 알려줘요</b>. 토스페이먼츠 문서는 웹훅을 '데이터가 변경됐을 때 실시간으로 알림을 받는 기능'이라고 설명해요. 예를 들어 결제 상태가 바뀌면 내가 등록한 주소로 알림이 와요.",["tosshook"]],
   ["SDK = 빌려 쓰기를 쉽게 해주는 공식 도구","회사가 직접 만들어 준 코드 묶음이에요. 예를 들어 토스페이먼츠는 브라우저에서 SDK를 시작할 때 클라이언트 키를 쓰라고 해요.",["tosskey"]],
   ["공짜가 아닐 수 있어요","Claude API는 모델마다 입력과 출력 가격을 100만 토큰 단위로 따로 매겨요. 많이 쓰면 그만큼 요금이 나가요.",["claude"]]
  ],
  lab:"ext",sum:"외부 API는 <b>남의 기능을 약속된 양식으로 빌려 쓰는 통로</b>다. 대부분 열쇠가 필요하고, 사용량만큼 돈이 들 수 있다."},
 key:{name:"열쇠",word:"API 키 · 환경변수",
  hook:{q:"이 두 개 중 GitHub에 올려도 괜찮은 건? <br><code>sb_publishable_…</code> / <code>sb_secret_…</code>",opts:["sb_publishable_…","sb_secret_…","둘 다 괜찮다"],a:0,
    reveal:"Supabase 문서는 publishable 키를 웹 페이지나 소스 코드에 둬도 된다고 하고, secret 키는 <b>브라우저와 소스 관리(GitHub)에 절대 두지 말라</b>고 해요. secret 키는 모든 RLS 규칙을 무시하거든요."},
  sec:[
   ["열쇠 = \"이 요청은 진짜 나예요\"의 증거","현관 비밀번호를 아는 사람은 누구든 들어가요. API 키도 똑같아요. 키를 가진 사람이 곧 주인으로 취급돼요.",["sbkey"]],
   ["열쇠는 두 종류",`<div class="tbl"><table><tr><th></th><th>보여도 되는 키</th><th>숨겨야 하는 키</th></tr><tr><td>Supabase</td><td><code>sb_publishable_</code> (예전 이름 anon)</td><td><code>sb_secret_</code> (예전 이름 service_role)</td></tr><tr><td>토스페이먼츠</td><td>클라이언트 키 (<code>ck</code>, <code>gck</code>)</td><td>시크릿 키 (<code>sk</code>, <code>gsk</code>)</td></tr><tr><td>둘 곳</td><td>화면에 둬도 됨</td><td><b>서버에만</b></td></tr></table></div>Supabase는 anon, service_role 키를 2026년 말까지 없앨 예정이라고 안내해요.`,["sbkey","tosskey"]],
   [".env = 비밀 메모장","<code>이름=값</code>을 한 줄씩 적는 파일이에요. 코드에는 이름만 쓰고, 진짜 값은 실행할 때 .env에서 꺼내요. Next.js 기본 템플릿은 .env 파일을 .gitignore에 넣어둬서 GitHub에 안 올라가게 해요.",["nextenv","ghignore"]],
   ["함정: NEXT_PUBLIC_","Next.js에서 이름 앞에 <code>NEXT_PUBLIC_</code>을 붙이면, 그 값이 브라우저로 가는 화면 코드 안에 <b>그대로 박혀서</b> 배달돼요. 붙이지 않은 값은 서버에서만 쓸 수 있어요. 숨겨야 하는 키에는 절대 붙이면 안 돼요.",["nextenv"]],
   ["새면 지우기보다 바꾸기가 먼저","GitHub 문서는 비밀이 올라갔다면 첫 단계로 그 비밀을 <b>폐기하거나 교체</b>하라고 해요. 바꾸고 나면 새어나간 키는 더 이상 쓸 수 없어요.",["ghleak"]]
  ],
  lab:"key",sum:"열쇠는 두 종류. <b>숨겨야 하는 키는 서버와 .env에만</b>. 새면 즉시 교체."},
 host:{name:"인터넷 주소",word:"배포 · 호스팅",
  hook:{q:"AI가 \"localhost:3000에서 확인하세요\"라고 했어요. 이 주소를 친구에게 보내면 친구 폰에서 열릴까요?",opts:["열린다","안 열린다"],a:1,
    reveal:"안 열려요. <b>localhost는 '지금 이 기기 자신'</b>을 가리키는 특별한 이름이라서, 친구 폰에서 열면 친구 폰 자기 자신을 찾아요."},
  sec:[
   ["localhost와 :3000","RFC 6761이라는 인터넷 표준 문서는 localhost를 언제나 그 기기 자신(루프백 주소)으로 연결되도록 정해요. 뒤의 <code>:3000</code>은 그 기기 안에서 프로그램을 구분하는 번호(포트)예요. 그래서 localhost 주소는 <b>내 컴퓨터에서 개발 중인 화면을 미리 보는 용도</b>예요.",["rfc"]],
   ["배포 = 인터넷에 올려두기","남도 들어오게 하려면, 인터넷에서 접속할 수 있는 컴퓨터에 내 화면과 서버를 올려야 해요. 이걸 배포(deploy)라고 해요. 배포하면 <code>my-app.vercel.app</code> 같은 주소가 생겨요.",["vercel"]],
   ["GitHub와 연결하면 자동으로 올라가요","Vercel 문서에 따르면 GitHub 저장소를 연결해 두면 올릴(푸시할) 때마다 자동으로 배포돼요. 대표 갈래(보통 <code>main</code>)는 <b>실제 서비스</b>, 다른 갈래는 <b>미리보기 주소</b>로 따로 배포돼요. 실제 서비스를 건드리기 전에 미리보기로 확인할 수 있어요.",["vercel"]],
   ["주소가 생기면 누구나 들어와요","주소를 아는 사람은 누구든 접속할 수 있다고 생각하세요. 숨길 내용이 있으면 로그인과 권한 규칙이 함께 있어야 해요.",["sbauth"]]

/* ============ 상태 ============ */
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let done=load("cs-done","{}"), seen=load("cs-seen","{}");
const S={view:"home",bi:0,guess:null,tid:null,tab:0,mi:0,ans:null,score:0,max:0,filter:"all"};
let L={};
const app=document.getElementById("app");
function go(v,extra){Object.assign(S,{view:v,ans:null},extra||{});if(v==="lesson"&&extra&&"bi" in extra){S.guess=null;L={};}render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){
  document.getElementById("score").textContent=`정답 ${S.score} / ${S.max}`;
  app.innerHTML={home,lesson,pick,type,words,rules}[S.view]();
  if(S.view==="lesson"&&S.guess!==null)renderLab();
}
function tally(ok){S.max++;if(ok)S.score++;}

/* ============ 홈 ============ */

  return `<section class="page">

      <button class="mi" onclick="go('words')"><span class="n">3</span><span><b>AI 말 번역기</b><span>AI가 자주 하는 말 ${PH.length}개, 무슨 뜻이고 뭘 확인할지</span></span><i>사전</i></button>
      <button class="mi" onclick="go('rules')"><span class="n">4</span><span><b>공통 규칙 3가지와 출처</b><span>무엇을 만들든 지킬 것</span></span><i>요약</i></button>

/* ============ 블록 레슨 ============ */

  const answered=S.guess!==null, right=S.guess===h.a;

    <span class="eyebrow">블록 ${S.bi+1} / 9</span>
    <div class="parts">${BORDER.map((id,i)=>`<button class="part ${i===S.bi?'on':''} ${seen[id]?'seen':''}" onclick="go('lesson',{bi:${i}})"><span class="sw" style="background:var(--b-${id})"></span><b>${B[id].name}</b><em>${B[id].word}</em></button>`).join("")}</div>
    <div class="bhead" style="background:var(--b-${k})"><h2>${b.name}</h2><span>어른들 말로: ${b.word}</span></div>
    <div class="guess">
      <span class="eyebrow">먼저 맞혀보세요</span>
      <p class="q">${h.q}</p>
      <div class="opts">${h.opts.map((o,i)=>{let c="";if(answered){if(i===h.a)c="right";else if(i===S.guess)c="wrong";}return `<button class="opt ${c}" ${answered?"disabled":""} onclick="guess(${i})">${o}</button>`}).join("")}</div>
      ${answered?`<div class="reveal ${right?'ok':'no'}"><strong>${right?"맞았어요":"반전이 있죠"}</strong><span>${h.reveal}</span></div>`:""}

    body=`<p class="lead">미션 ${S.mi+1} / ${t.ms.length}</p>
    ${isAI?`<div class="bub"><span class="who">AI가 승인을 기다려요</span>${m.say}</div>`:`<p class="q" style="font-size:18px;font-weight:700">${m.q}</p>`}
    <div class="${isAI?'row':'opts'}">${opts.map((o,i)=>{let c="";if(S.ans!==null){if(i===correct)c="right";else if(i===S.ans)c="wrong";}return `<button class="opt ${c}" ${S.ans!==null?"disabled":""} onclick="answer(${i},${correct})">${o}</button>`}).join("")}</div>
    ${S.ans!==null?`<div class="reveal ${right?'ok':'no'}"><strong>${right?"정답이에요":"다시 볼까요"}${isAI?` · ${m.ok?"승인":"거절"}이 맞아요`:""}</strong><span>${m.why}</span>${srcs([m.s])}</div>
    ${S.mi<t.ms.length-1?`<button class="btn" onclick="go('type',{mi:${S.mi+1}})">다음 미션</button>`:`<button class="btn" onclick="finish('${t.id}')">완료하고 다른 것 고르기</button>`}`:""}`;
  }
  return `<section class="page">
    <span class="eyebrow">${t.ico} ${t.name}</span>
    <div class="tabs">${tabs.map((x,i)=>`<button class="${i===S.tab?'on':''}" onclick="go('type',{tab:${i},mi:0})">${i+1}. ${x}</button>`).join("")}</div>
    ${body}
  </section>`;
}
function answer(i,c){S.ans=i;tally(i===c);render();}
function finish(id){done[id]=1;store("cs-done",done);go('pick');}

/* ============ AI 말 번역기 ============ */
function words(){
  const f=S.filter, list=PH.filter(p=>f==="all"||p.b===f||(f==="danger"&&p.danger));
  return `<section class="page">
    <span class="eyebrow">AI 말 번역기</span>
    <h2>AI가 이렇게 말하면, 이런 뜻이에요</h2>
    <p class="lead">승인 버튼을 누르기 전에 \"확인할 것\"만 한 번 보세요.</p>
    <div class="chips"><button class="chip ${f==="all"?'on':''}" onclick="go('words',{filter:'all'})">전체</button><button class="chip ${f==="danger"?'on':''}" onclick="go('words',{filter:'danger'})">⚠ 조심할 말</button>${BORDER.map(k=>`<button class="chip ${f===k?'on':''}" onclick="go('words',{filter:'${k}'})">${B[k].name}</button>`).join("")}</div>
    ${list.map(p=>`<div class="ph"><div class="say ${p.danger?'danger':''}">${p.danger?"⚠ ":"💬 "}\"${p.say}\"</div>
      <dl><dt>뜻</dt><dd>${p.mean}</dd><dt>확인할 것</dt><dd>${p.chk}</dd></dl>
      <span class="src">${p.b!=="all"?B[p.b].name+" 블록 · ":""}근거 · ${src(p.s)}</span></div>`).join("")}
  </section>`;
}

/* ============ 공통 규칙 ============ */
function rules(){
  return `<section class="page">
    <span class="eyebrow">무엇을 만들든</span>
    <h2>공통 규칙 3가지</h2>
    <ol class="rules">
      <li><b>숨겨야 하는 열쇠는 서버에만.</b> 화면 코드와 GitHub에는 두지 않아요. 새면 지우기보다 <b>폐기하고 새로 발급</b>이 먼저예요.<br>${srcs(["sbkey","tosskey","ghleak"])}</li>
      <li><b>사용자가 보낸 값은 서버가 다시 확인.</b> 점수, 금액, 권한처럼 중요한 값은 화면에서 온 그대로 믿지 않아요.<br>${srcs(["mdn","tossflow"])}</li>
      <li><b>진짜 돈 전에 테스트.</b> 결제는 테스트 키, 주식은 모의투자 계좌로 먼저 돌려봐요.<br>${srcs(["tosskey","kismock"])}</li>
    </ol>
    <span class="eyebrow">이 교실이 참고한 문서 전체 (2026-10-09 확인)</span>
    <ul class="srclist">${Object.keys(SRC).map(k=>`<li>${src(k)}</li>`).join("")}</ul>
    <button class="btn alt" onclick="go('home')">처음으로</button>
  </section>`;
}

render();
</script>
